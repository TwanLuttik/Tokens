plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.twanluttik'
version = '3.0.0-PRE-v1'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "bstats"
        url = "https://repo.codemc.org/repository/maven-public"
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT"
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.8.16'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    
    // Relocate bStats to avoid conflicts with other plugins
    relocate 'org.bstats', 'com.twanluttik.tokens.bstats'
    
    // Only include necessary dependencies
    dependencies {
        include(dependency('org.postgresql:postgresql'))
        include(dependency('com.google.code.gson:gson'))
        include(dependency('org.bstats:bstats-bukkit'))
    }
    
    minimize()
}

// Make shadowJar the default build task
build.dependsOn shadowJar
assemble.dependsOn shadowJar

// Set the default jar task to be the shadowJar
jar.enabled = false
