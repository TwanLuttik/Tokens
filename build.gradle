plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.twanluttik'
version = '3.0.0-PRE-v1'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT"
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.8.16'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation("org.bstats:bstats-bukkit:3.1.0")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}




// Configure regular jar to include dependencies
jar {
    archiveFileName = 'Tokens.jar'
    manifest {
        attributes 'Implementation-Title': 'Tokens',
                   'Implementation-Version': version
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Make jar the default build task
build.dependsOn jar
assemble.dependsOn jar

// Task to copy JAR to server plugins directory
task copyToServer {
    dependsOn jar
    doLast {
        def serverPluginsDir = project.findProperty('MC_SERVER_PLUGINS_DIR') ?: System.getenv('MC_SERVER_PLUGINS_DIR') ?: './server/plugins'
        def pluginJar = jar.archiveFile.get().asFile
        def destJar = new File(serverPluginsDir, pluginJar.name)
        
        if (pluginJar.exists()) {
            // Delete old JAR if it exists
            if (destJar.exists()) {
                destJar.delete()
                println "✓ Deleted old plugin: ${destJar.path}"
            }
            
            copy {
                from pluginJar
                into serverPluginsDir
            }
            println "✓ Plugin copied to: $serverPluginsDir"
        } else {
            println "✗ Plugin JAR not found: ${pluginJar.path}"
        }
    }
}
